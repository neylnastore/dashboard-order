<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics | NEYLNA STORE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { slate: { 850: '#151e2e', 900: '#0f172a' } },
                    animation: { 'fade-in-up': 'fadeInUp 0.5s ease-out forwards' },
                    keyframes: { fadeInUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        
        /* Custom Scrollbar Premium */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Pulse Dot */
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.5); } 100% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } }
        
        /* Daterangepicker Dark Theme Premium */
        .daterangepicker { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .daterangepicker .calendar-table { background-color: transparent; border: none; }
        .daterangepicker td.off, .daterangepicker td.off.in-range, .daterangepicker td.off.start-date, .daterangepicker td.off.end-date { background-color: #0f172a; color: #475569; }
        .daterangepicker td.available:hover, .daterangepicker th.available:hover { background-color: #334155; border-radius: 6px; }
        .daterangepicker td.active, .daterangepicker td.active:hover { background-image: linear-gradient(to right, #3b82f6, #06b6d4); border-radius: 6px; }
        .daterangepicker .ranges li { background-color: #1e293b; color: #cbd5e1; border-radius: 6px; margin: 2px 8px; }
        .daterangepicker .ranges li:hover, .daterangepicker .ranges li.active { background-image: linear-gradient(to right, #3b82f6, #06b6d4); color: white; }
        .daterangepicker .drp-buttons { border-top: 1px solid #334155; }

        /* Kustomisasi Dropdown Status */
        select.status-pending { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        select.status-closing { background-color: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        select option { background-color: #1e293b; color: white; }
        
        /* Custom Checkbox Gacor */
        .chk-box { appearance: none; width: 18px; height: 18px; border: 2px solid #475569; border-radius: 4px; background-color: transparent; cursor: pointer; position: relative; transition: all 0.2s; }
        .chk-box:checked { background-color: #3b82f6; border-color: #3b82f6; }
        .chk-box:checked::after { content: '\\f00c'; font-family: 'Font Awesome 5 Free'; font-weight: 900; color: white; font-size: 10px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-[#0f172a] to-black">

    <aside class="w-64 bg-slate-900/50 backdrop-blur-xl border-r border-slate-800/80 hidden md:flex flex-col flex-shrink-0 relative z-20">
        <div class="p-8">
            <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 tracking-tight">REWOOSSS</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold"><i class="fas fa-bolt text-amber-400 mr-1"></i> Order Report</p>
        </div>
        <nav class="mt-4 px-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20 shadow-[0_0_15px_rgba(59,130,246,0.1)] transition-all">
                <i class="fas fa-chart-pie text-lg"></i> <span class="font-bold">Live Dashboard</span>
            </a>
        </nav>
        
        <div class="mt-auto p-6">
            <div class="p-4 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-500/20 rounded-full blur-xl"></div>
                <p class="text-xs text-slate-400 mb-1">Status Sistem</p>
                <div class="flex items-center gap-2 text-sm font-bold text-emerald-400">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full pulse"></div> Optimal
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto relative z-10">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-4">
            <div>
                <h2 class="text-4xl font-extrabold text-white tracking-tight mb-2">Real-Time Analytics</h2>
                <div class="flex items-center gap-2 bg-slate-800/60 backdrop-blur-sm text-slate-300 px-4 py-1.5 rounded-full border border-slate-700/50 text-sm font-medium w-max shadow-sm" id="status-container">
                    <div class="w-2.5 h-2.5 bg-amber-500 rounded-full shadow-[0_0_8px_rgba(245,158,11,0.8)]" id="status-dot"></div>
                    <span id="status-text">Menyambung ke Server...</span>
                </div>
            </div>
            
            <div class="flex flex-col items-start md:items-end w-full md:w-auto">
                <label class="text-xs text-slate-400 mb-1.5 font-bold uppercase tracking-wider">Rentang Waktu</label>
                <div class="relative group w-full md:w-auto">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <i class="fas fa-calendar-alt text-blue-400 group-hover:text-blue-300 transition-colors"></i>
                    </div>
                    <input type="text" id="reportrange" class="bg-slate-800/80 backdrop-blur-md text-white border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-lg w-full md:w-72 text-center font-bold hover:bg-slate-700/80 transition-all" />
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <div class="relative overflow-hidden bg-slate-800/40 backdrop-blur-xl p-6 rounded-2xl border border-slate-700/50 shadow-lg hover:shadow-[0_8px_30px_rgba(59,130,246,0.15)] hover:-translate-y-1 transition-all duration-300 group">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl group-hover:bg-blue-500/30 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <p class="text-sm text-slate-400 font-semibold uppercase tracking-wide">Total Order</p>
                    <div class="p-2 bg-blue-500/10 rounded-lg text-blue-400"><i class="fas fa-shopping-cart"></i></div>
                </div>
                <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300" id="stat-orders">0</h3>
            </div>
            
            <div class="relative overflow-hidden bg-slate-800/40 backdrop-blur-xl p-6 rounded-2xl border border-slate-700/50 shadow-lg hover:shadow-[0_8px_30px_rgba(16,185,129,0.15)] hover:-translate-y-1 transition-all duration-300 group">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-emerald-500/20 rounded-full blur-2xl group-hover:bg-emerald-500/30 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <p class="text-[11px] lg:text-sm text-slate-400 font-semibold uppercase tracking-wide">Closing Transfer</p>
                    <div class="p-2 bg-emerald-500/10 rounded-lg text-emerald-400"><i class="fa fa-credit-card"></i></div>
                </div>
                <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200" id="stat-bayar">0</h3>
            </div>

            <div class="relative overflow-hidden bg-slate-800/40 backdrop-blur-xl p-6 rounded-2xl border border-slate-700/50 shadow-lg hover:shadow-[0_8px_30px_rgba(168,85,247,0.15)] hover:-translate-y-1 transition-all duration-300 group">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-purple-500/20 rounded-full blur-2xl group-hover:bg-purple-500/30 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <p class="text-sm text-slate-400 font-semibold uppercase tracking-wide">Closing Rate</p>
                    <div class="p-2 bg-purple-500/10 rounded-lg text-purple-400"><i class="fas fa-chart-line"></i></div>
                </div>
                <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-300" id="stat-rasio">0%</h3>
            </div>

            <div class="relative overflow-hidden bg-slate-800/40 backdrop-blur-xl p-6 rounded-2xl border border-slate-700/50 shadow-lg hover:shadow-[0_8px_30px_rgba(245,158,11,0.15)] hover:-translate-y-1 transition-all duration-300 group">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-amber-500/20 rounded-full blur-2xl group-hover:bg-amber-500/30 transition-all"></div>
                <div class="flex justify-between items-start mb-4">
                    <p class="text-[11px] lg:text-sm text-slate-400 font-semibold uppercase tracking-wide">Closing COD</p>
                    <div class="p-2 bg-amber-500/10 rounded-lg text-amber-400"><i class="fa-solid fa-truck-fast"></i></div>
                </div>
                <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-200" id="stat-pending">0</h3>
            </div>
        </div>

        <div class="flex flex-col-reverse md:flex-row justify-between items-center mb-6 gap-4 min-h-[48px]">
            <div id="bulk-action-panel" class="hidden flex items-center gap-3 bg-slate-800/80 backdrop-blur-md px-5 py-2.5 rounded-xl border border-blue-500/30 shadow-[0_0_20px_rgba(59,130,246,0.15)] animate-fade-in-up w-full md:w-auto">
                <span class="text-sm font-semibold text-slate-300"><span id="selected-count" class="font-black text-blue-400 text-lg mr-1">0</span> data</span>
                <div class="h-5 w-px bg-slate-600 mx-2"></div>
                <button onclick="applyBulkAction('Pending')" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500 hover:text-slate-900 transition-all px-4 py-2 rounded-lg text-xs font-bold flex-1 md:flex-none text-center">
                    <i class="fas fa-clock mr-1"></i> Set Pending
                </button>
                <button onclick="applyBulkAction('Closing')" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500 hover:text-slate-900 transition-all px-4 py-2 rounded-lg text-xs font-bold flex-1 md:flex-none text-center">
                    <i class="fas fa-check mr-1"></i> Set Closing
                </button>
            </div>

            <div class="flex gap-3 ml-auto w-full md:w-auto">
                <div class="flex-1 md:flex-none text-xs font-bold text-slate-300 flex justify-between md:justify-start items-center gap-2 bg-slate-800/50 backdrop-blur-sm px-4 py-2 rounded-xl border border-slate-700/50 shadow-sm">
                    <div class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400"><i class="fas fa-university"></i></div> BANK TRANSFER</div>
                    <span id="mini-tf" class="text-lg text-white ml-2">0</span>
                </div>
                <div class="flex-1 md:flex-none text-xs font-bold text-slate-300 flex justify-between md:justify-start items-center gap-2 bg-slate-800/50 backdrop-blur-sm px-4 py-2 rounded-xl border border-slate-700/50 shadow-sm">
                    <div class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400"><i class="fas fa-truck"></i></div> COD</div>
                    <span id="mini-cod" class="text-lg text-white ml-2">0</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-850/60 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-2xl overflow-hidden mb-10 relative">
            <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none"></div>
            
            <div class="overflow-x-auto relative z-10">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-400 text-xs uppercase tracking-widest border-b border-slate-700/50 shadow-sm">
                            <th class="p-5 w-14 text-center"><input type="checkbox" id="selectAll" class="chk-box" onclick="toggleAllCheckboxes(this)"></th>
                            <th class="p-5 font-bold">Waktu Masuk</th>
                            <th class="p-5 font-bold">ID Order</th>
                            <th class="p-5 font-bold">Pelanggan</th>
                            <th class="p-5 font-bold">Campaign</th>
                            <th class="p-5 font-bold text-center">Metode</th>
                            <th class="p-5 font-bold text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body" class="text-sm divide-y divide-slate-700/30">
                        <tr>
                            <td colspan="7" class="p-16 text-center text-slate-500 font-medium">
                                <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                                <p>Menyiapkan data analytics...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let allOrders = []; 
        let currentStartDate = moment().startOf('month'); 
        let currentEndDate = moment().endOf('day');       

        const socket = io('https://capsule-zoology-overact.ngrok-free.dev'); // Ganti URL jika hosting

        // LOGIKA KOTAK CENTANG & EKSEKUSI JAMAAH
        function toggleAllCheckboxes(source) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
            updateBulkPanelUI();
        }

        function updateBulkPanelUI() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const panel = document.getElementById('bulk-action-panel');
            const countSpan = document.getElementById('selected-count');

            if (checkedBoxes.length > 0) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                countSpan.textContent = checkedBoxes.length;
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
                document.getElementById('selectAll').checked = false;
            }
        }

        function applyBulkAction(newStatus) {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedIds.length > 0) {
                socket.emit('ubah_status_massal', { ids: selectedIds, status: newStatus });
                checkedBoxes.forEach(cb => cb.checked = false);
                updateBulkPanelUI();
            }
        }

        function updateStatus(orderId, selectElement) {
            const newStatus = selectElement.value;
            socket.emit('ubah_status', { id: orderId, status: newStatus });
        }

        // INISIALISASI KALENDER
        $(function() {
            function cb(start, end) {
                $('#reportrange').val(start.format('DD/MM/YYYY') + ' - ' + end.format('DD/MM/YYYY'));
                currentStartDate = start;
                currentEndDate = end;
                applyFilter(); 
            }

            $('#reportrange').daterangepicker({
                startDate: currentStartDate,
                endDate: currentEndDate,
                minDate: '01/06/2026', 
                ranges: {
                   'Hari ini': [moment(), moment()],
                   'Kemarin': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                   '7 Hari Terakhir': [moment().subtract(6, 'days'), moment()],
                   'Bulan ini': [moment().startOf('month'), moment().endOf('month')]
                },
                locale: {
                    format: 'DD/MM/YYYY',
                    applyLabel: "Terapkan",
                    cancelLabel: "Batal",
                    customRangeLabel: "Pilih Kalender",
                    daysOfWeek: ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"],
                    monthNames: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"]
                }
            }, cb);
            cb(currentStartDate, currentEndDate);
        });

        function applyFilter() {
            const startTimestamp = currentStartDate.startOf('day').valueOf();
            const endTimestamp = currentEndDate.endOf('day').valueOf();
            const filteredOrders = allOrders.filter(order => order.timestamp >= startTimestamp && order.timestamp <= endTimestamp);
            updateDashboardUI(filteredOrders);
        }

        function updateDashboardUI(filteredOrders) {
            const tbody = document.getElementById('order-table-body');
            tbody.innerHTML = '';
            
            document.getElementById('bulk-action-panel').classList.add('hidden');
            document.getElementById('bulk-action-panel').classList.remove('flex');
            document.getElementById('selectAll').checked = false;

            // Variabel Logika Baru
            let countTotal = filteredOrders.length;
            let countClosingAll = 0; // Untuk hitung rasio persentase
            let countClosingTF = 0;  // Untuk Kartu 2 (Closing Transfer)
            let countClosingCOD = 0; // Untuk Kartu 4 (Closing COD)
            let countTF = 0;
            let countCOD = 0;

            if(filteredOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-16 text-center text-slate-500 font-medium"><i class="fas fa-box-open text-4xl block mb-3 opacity-50"></i> Data kosong pada rentang tanggal ini.</td></tr>';
            } else {
                filteredOrders.forEach((order, index) => {
                    // Hitung total metode TF/COD secara keseluruhan (untuk widget bawah)
                    if(order.paymentMethod === "COD") countCOD++; else countTF++;

                    // Logika memisahkan Closing TF dan Closing COD
                    if(order.status === "Closing") {
                        countClosingAll++; // Tambah ke total closing keseluruhan
                        if(order.paymentMethod === "COD") {
                            countClosingCOD++;
                        } else {
                            countClosingTF++;
                        }
                    }

                    const dateObj = new Date(order.timestamp);
                    const formattedDate = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
                    const formattedTime = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    
                    const selectClass = order.status === "Closing" ? "status-closing" : "status-pending";
                    const badgeClass = order.paymentMethod === "COD" 
                        ? "bg-amber-500/10 text-amber-400 border-amber-500/30" 
                        : "bg-blue-500/10 text-blue-400 border-blue-500/30";
                    const iconClass = order.paymentMethod === "COD" ? "fa-truck" : "fa-university";

                    const animationDelay = index < 10 ? `style="animation-delay: ${index * 0.05}s"` : '';

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-700/30 transition-colors duration-200 animate-fade-in-up opacity-0';
                    tr.innerHTML = `
                        <td class="p-4 text-center border-b border-slate-700/30" ${animationDelay}><input type="checkbox" class="row-checkbox chk-box" value="${order.id}" onchange="updateBulkPanelUI()"></td>
                        <td class="p-4 font-medium border-b border-slate-700/30" ${animationDelay}><div class="flex flex-col"><span class="text-slate-200">${formattedDate}</span><span class="text-[11px] text-slate-500 font-semibold"><i class="far fa-clock mr-1"></i>${formattedTime}</span></div></td>
                        <td class="p-4 border-b border-slate-700/30" ${animationDelay}><span class="font-mono text-xs px-2 py-1 bg-slate-900/50 text-cyan-400 border border-cyan-500/20 rounded-md">${order.id}</span></td>
                        <td class="p-4 font-bold text-slate-100 border-b border-slate-700/30" ${animationDelay}>${order.name}</td>
                        <td class="p-4 text-slate-400 max-w-xs truncate font-medium border-b border-slate-700/30" ${animationDelay}>${order.product}</td>
                        <td class="p-4 text-center border-b border-slate-700/30" ${animationDelay}>
                            <span class="px-2.5 py-1 rounded-md text-[11px] font-black border uppercase tracking-wider ${badgeClass}">
                                <i class="fas ${iconClass} mr-1"></i> ${order.paymentMethod || '-'}
                            </span>
                        </td>
                        <td class="p-4 text-center border-b border-slate-700/30" ${animationDelay}>
                            <select onchange="updateStatus('${order.id}', this)" class="text-xs rounded-lg px-3 py-1.5 focus:outline-none cursor-pointer font-bold outline-none shadow-sm transition-colors ${selectClass}">
                                <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>PENDING</option>
                                <option value="Closing" ${order.status === 'Closing' ? 'selected' : ''}>CLOSING</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Persentase Closing Rate mengambil dari total Closing keseluruhan
            const rasio = countTotal === 0 ? 0 : Math.round((countClosingAll / countTotal) * 100);
            
            // Animasi Counter Effect ke masing-masing kartu
            $({ countNum: parseInt($('#stat-orders').text()) }).animate({ countNum: countTotal }, { duration: 500, step: function() { $('#stat-orders').text(Math.floor(this.countNum)); }, complete: function() { $('#stat-orders').text(this.countNum); } });
            
            // Kartu ID stat-bayar me-render Closing Transfer
            $({ countNum: parseInt($('#stat-bayar').text()) }).animate({ countNum: countClosingTF }, { duration: 500, step: function() { $('#stat-bayar').text(Math.floor(this.countNum)); }, complete: function() { $('#stat-bayar').text(this.countNum); } });
            
            // Kartu ID stat-pending me-render Closing COD
            $({ countNum: parseInt($('#stat-pending').text()) }).animate({ countNum: countClosingCOD }, { duration: 500, step: function() { $('#stat-pending').text(Math.floor(this.countNum)); }, complete: function() { $('#stat-pending').text(this.countNum); } });
            
            document.getElementById('stat-rasio').textContent = rasio + "%";
            document.getElementById('mini-tf').textContent = countTF;
            document.getElementById('mini-cod').textContent = countCOD;
        }

        socket.on('connect', () => {
            const container = document.getElementById('status-container');
            container.className = "flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-4 py-1.5 rounded-full border border-emerald-500/20 text-sm font-bold shadow-[0_0_15px_rgba(16,185,129,0.2)]";
            document.getElementById('status-text').textContent = "Sistem Online";
            document.getElementById('status-dot').className = "w-2.5 h-2.5 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] pulse";
        });

        socket.on('history_orders', (dataHistory) => { allOrders = dataHistory; applyFilter(); });
        socket.on('order_baru', (dataOrder) => { if(!allOrders.find(o => o.id === dataOrder.id)) { allOrders.unshift(dataOrder); applyFilter(); }});
    </script>
</body>
</html>
